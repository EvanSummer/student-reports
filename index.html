<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生学习档案中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #333;
      padding: 40px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }

    /* Header */
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 32px; color: #2c3e50; margin-bottom: 8px; }
    .header .subtitle { color: #7f8c8d; font-size: 15px; }

    /* Global Stats */
    .global-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
    }
    .stat-card .value { font-size: 28px; font-weight: bold; }
    .stat-card .label { font-size: 13px; opacity: 0.9; margin-top: 4px; }

    /* Student Card */
    .student-card {
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .student-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .student-name {
      font-size: 22px;
      font-weight: 700;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .student-name .dot {
      width: 10px;
      height: 10px;
      background: #27ae60;
      border-radius: 50%;
    }
    .student-badge {
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-top { background: #fff3e0; color: #e65100; }
    .badge-star { background: #e8f5e9; color: #2e7d32; }

    /* Mini Stats Row */
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .mini-stat {
      text-align: center;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .mini-stat .num { font-size: 20px; font-weight: bold; color: #667eea; }
    .mini-stat .txt { font-size: 12px; color: #7f8c8d; margin-top: 2px; }

    /* Link Grid */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #f8f9fa;
      text-decoration: none;
      color: #2c3e50;
      font-size: 14px;
      transition: all 0.2s;
      border: 1px solid #e9ecef;
    }
    .link-item:hover {
      background: #e8f4fd;
      border-color: #3498db;
      transform: translateY(-1px);
    }
    .link-item .icon { font-size: 18px; }
    .link-item.pdf { background: #fff5f5; border-color: #ffcdd2; }
    .link-item.pdf:hover { background: #ffebee; border-color: #ef5350; }

    /* Footer */
    .footer {
      text-align: center;
      color: #95a5a6;
      font-size: 12px;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .mini-stats { grid-template-columns: repeat(2, 1fr); }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
